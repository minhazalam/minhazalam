name: Validate DE preparation dashboard

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile de-prep/build_dashboard.py
      - name: Build dashboard from public allowlist
        run: python de-prep/build_dashboard.py
